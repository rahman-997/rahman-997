name: Profile link health

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/check-profile-links.mjs
      - .github/workflows/link-health.yml
      - .github/dependabot.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - scripts/check-profile-links.mjs
      - .github/workflows/link-health.yml
      - .github/dependabot.yml
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-link-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0

      - name: Verify critical public links
        run: node scripts/check-profile-links.mjs
