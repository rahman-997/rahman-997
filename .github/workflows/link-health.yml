name: Profile quality and link health

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/link-health.yml
      - .github/dependabot.yml
      - CONTRIBUTING.md
  pull_request:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/link-health.yml
      - .github/dependabot.yml
      - CONTRIBUTING.md
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run offline README and workflow tests
        run: node --test tests/*.test.mjs
      - name: Audit README navigation, images and accessibility
        run: node scripts/profile-audit.mjs
      - name: Audit technical guide navigation
        run: node scripts/audit-guides.mjs
      - name: Validate SVG illustrations
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 scripts/verify-svg.py
      - name: Inventory public links without network access
        run: node scripts/check-profile-links.mjs --list

  verify-public-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Probe external sites (may be sleeping or block bots)
        run: node scripts/check-profile-links.mjs
