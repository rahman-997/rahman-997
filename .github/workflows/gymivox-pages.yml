name: Deploy GYMIVOX to GitHub Pages

on:
  push:
    branches: ["gymivox-production"]
    paths:
      - "gymivox/**"
      - ".github/workflows/gymivox-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gymivox-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GYMIVOX
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gymivox

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
