<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-label="Evidence compass: choose a project, inspect source, check tests, and verify operational limits">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1820"/><stop offset="1" stop-color="#18383e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6fe9c9"/><stop offset="1" stop-color="#7eb5f5"/></linearGradient>
  </defs>
  <rect width="1120" height="350" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="60" r="134" fill="#57bfae" opacity="0.055"/>
  <circle cx="100" cy="320" r="126" fill="#7eb5f5" opacity="0.04"/>
  <g font-family="Arial, sans-serif">
    <text x="42" y="48" font-size="15" font-weight="bold" fill="#6fe9c9" letter-spacing="2">ENGINEERING / EVIDENCE HUB</text>
    <text x="42" y="92" font-size="31" font-weight="bold" fill="#f2fff9">Follow evidence, not only claims.</text>
    <text x="42" y="122" font-size="16" fill="#a9c9c5">A repeatable review path across six public projects</text>
    <line x1="72" y1="218" x2="1050" y2="218" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 8" opacity="0.8"/>
    <g>
      <rect x="40" y="164" width="244" height="116" rx="16" fill="#22383e" stroke="#6fe9c9" stroke-width="1.5"/>
      <circle cx="71" cy="184" r="15" fill="#6fe9c9"/><text x="71" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a1a20">1</text>
      <text x="62" y="222" font-size="22" font-weight="bold" fill="#ffffff">CHOOSE</text>
      <text x="62" y="249" font-size="14" fill="#b0d0cb">Project + question</text>
    </g>
    <g>
      <rect x="304" y="164" width="244" height="116" rx="16" fill="#22383e" stroke="#6fe9c9" stroke-width="1.5"/>
      <circle cx="335" cy="184" r="15" fill="#6fe9c9"/><text x="335" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a1a20">2</text>
      <text x="326" y="222" font-size="22" font-weight="bold" fill="#ffffff">TRACE</text>
      <text x="326" y="249" font-size="14" fill="#b0d0cb">Source + boundaries</text>
    </g>
    <g>
      <rect x="568" y="164" width="244" height="116" rx="16" fill="#22383e" stroke="#6fe9c9" stroke-width="1.5"/>
      <circle cx="599" cy="184" r="15" fill="#6fe9c9"/><text x="599" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a1a20">3</text>
      <text x="590" y="222" font-size="22" font-weight="bold" fill="#ffffff">TEST</text>
      <text x="590" y="249" font-size="14" fill="#b0d0cb">Behavior + failures</text>
    </g>
    <g>
      <rect x="832" y="164" width="244" height="116" rx="16" fill="#22383e" stroke="#7eb5f5" stroke-width="1.5"/>
      <circle cx="863" cy="184" r="15" fill="#7eb5f5"/><text x="863" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a1a20">4</text>
      <text x="854" y="222" font-size="22" font-weight="bold" fill="#ffffff">QUALIFY</text>
      <text x="854" y="249" font-size="14" fill="#b0d0cb">Limits + live context</text>
    </g>
    <text x="42" y="319" font-size="13" fill="#97b9b9">Source code  ·  Tests  ·  Security  ·  Privacy  ·  Deployment context</text>
