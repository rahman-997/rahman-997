<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" role="img" aria-label="Mobile evidence compass: choose, trace, test and qualify a project's claims">
  <defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1820"/><stop offset="1" stop-color="#18383e"/></linearGradient></defs>
  <rect width="380" height="560" rx="20" fill="url(#bgm)"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="36" font-size="13" letter-spacing="1.5" font-weight="bold" fill="#6fe9c9">ENGINEERING / EVIDENCE HUB</text>
    <text x="20" y="72" font-size="23" font-weight="bold" fill="#f2fff9">Follow the evidence.</text>
    <text x="20" y="94" font-size="13" fill="#a9c9c5">A compact path through real project code</text>
    <line x1="44" y1="124" x2="44" y2="478" stroke="#6fe9c9" opacity="0.5" stroke-dasharray="6 7" stroke-width="2"/>
    <g>
      <rect x="18" y="116" width="344" height="86" rx="14" fill="#22383e" stroke="#6fe9c9"/>
      <circle cx="45" cy="143" r="16" fill="#6fe9c9"/><text x="45" y="149" text-anchor="middle" font-weight="bold" font-size="15" fill="#102129">1</text>
      <text x="72" y="147" font-size="21" font-weight="bold" fill="#ffffff">CHOOSE</text>
      <text x="72" y="177" font-size="14" fill="#b0d0cb">Project + engineering question</text>
    </g>
    <g>
      <rect x="18" y="216" width="344" height="86" rx="14" fill="#22383e" stroke="#6fe9c9"/>
      <circle cx="45" cy="243" r="16" fill="#6fe9c9"/><text x="45" y="249" text-anchor="middle" font-weight="bold" font-size="15" fill="#102129">2</text>
      <text x="72" y="247" font-size="21" font-weight="bold" fill="#ffffff">TRACE</text>
      <text x="72" y="277" font-size="14" fill="#b0d0cb">Source + data boundaries</text>
    </g>
    <g>
      <rect x="18" y="316" width="344" height="86" rx="14" fill="#22383e" stroke="#6fe9c9"/>
      <circle cx="45" cy="343" r="16" fill="#6fe9c9"/><text x="45" y="349" text-anchor="middle" font-weight="bold" font-size="15" fill="#102129">3</text>
      <text x="72" y="347" font-size="21" font-weight="bold" fill="#ffffff">TEST</text>
      <text x="72" y="377" font-size="14" fill="#b0d0cb">Behavior + failure paths</text>
    </g>
    <g>
      <rect x="18" y="416" width="344" height="86" rx="14" fill="#22383e" stroke="#7eb5f5"/>
      <circle cx="45" cy="443" r="16" fill="#7eb5f5"/><text x="45" y="449" text-anchor="middle" font-weight="bold" font-size="15" fill="#102129">4</text>
      <text x="72" y="447" font-size="21" font-weight="bold" fill="#ffffff">QUALIFY</text>
      <text x="72" y="477" font-size="14" fill="#b0d0cb">Limits + deployment context</text>
    </g>
    <text x="21" y="536" font-size="12" fill="#96bcb9">Source · Tests · Privacy · Availability</text>
  </g>
</svg>
