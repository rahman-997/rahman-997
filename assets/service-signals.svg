<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" role="img" aria-labelledby="ss-title ss-desc">
  <title id="ss-title">Observability and service signals</title>
  <desc id="ss-desc">A sample engineering dashboard groups request signals, queued work, dependencies, and deployment checks to help explain service health.</desc>
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17333D"/><stop offset="1" stop-color="#0B1725"/></linearGradient>
  </defs>
  <rect width="560" height="268" rx="17" fill="url(#ss-bg)"/>
  <rect x="1" y="1" width="558" height="266" rx="16" fill="none" stroke="#42656D"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="20" y="27" font-size="10" font-weight="700" letter-spacing="1.8" fill="#A5F3D6">OPERATIONS / SIGNALS</text>
    <text x="20" y="55" font-size="20" font-weight="700" fill="#EFFCF8">Make system behavior visible.</text>
    <text x="20" y="73" font-size="10" fill="#B7D4D3">Conceptual checks, not live production metrics</text>
    <rect x="19" y="91" width="328" height="157" rx="10" fill="#182F3D" stroke="#476A73"/>
    <text x="32" y="112" font-size="10" font-weight="700" fill="#DCF5EF">Request trend</text>
    <text x="333" y="112" text-anchor="end" font-size="8" fill="#9FDCC9">ILLUSTRATIVE</text>
    <path d="M39 135 H328 M39 168 H328 M39 201 H328 M39 227 H328" stroke="#355563" stroke-width="1" opacity=".8"/>
    <path d="M41 191 L69 180 L96 184 L124 161 L154 170 L184 149 L211 160 L240 134 L269 150 L296 131 L324 139" fill="none" stroke="#9DECD0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M41 213 L72 212 L103 218 L132 210 L160 216 L187 215 L218 207 L245 211 L277 210 L309 213 L324 209" fill="none" stroke="#D6B778" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="324" cy="139" r="4" fill="#D6FFE9"/>
    <text x="42" y="241" font-size="8" fill="#BDD5D7">Requests</text>
    <line x1="91" y1="239" x2="108" y2="239" stroke="#9DECD0" stroke-width="3"/>
    <text x="137" y="241" font-size="8" fill="#BDD5D7">Errors</text>
    <line x1="175" y1="239" x2="192" y2="239" stroke="#D6B778" stroke-width="3"/>
    <g>
      <rect x="358" y="91" width="183" height="45" rx="9" fill="#1B3B46" stroke="#476A73"/>
      <circle cx="373" cy="112" r="6" fill="#88DEB8"/>
      <text x="387" y="109" fill="#E4F7EF" font-size="10" font-weight="700">Queue movement</text>
      <text x="387" y="123" fill="#AECDD0" font-size="8.5">Pending / retry / complete</text>
      <rect x="358" y="146" width="183" height="45" rx="9" fill="#1B3B46" stroke="#476A73"/>
      <circle cx="373" cy="167" r="6" fill="#EBC886"/>
      <text x="387" y="164" fill="#E4F7EF" font-size="10" font-weight="700">Dependencies</text>
      <text x="387" y="178" fill="#AECDD0" font-size="8.5">Storage / connections</text>
      <rect x="358" y="201" width="183" height="45" rx="9" fill="#1B3B46" stroke="#476A73"/>
      <circle cx="373" cy="222" r="6" fill="#88DEB8"/>
      <text x="387" y="219" fill="#E4F7EF" font-size="10" font-weight="700">Release checks</text>
      <text x="387" y="233" fill="#AECDD0" font-size="8.5">Deploy / smoke / verify</text>
    </g>
  </g>
</svg>
