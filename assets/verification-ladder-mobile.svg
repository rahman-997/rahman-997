<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1150" role="img" aria-label="Mobile verification ladder showing unit, API contract, UI, and live signals as complementary evidence.">
<rect x="0" y="0" width="600" height="1150" rx="0" fill="#0A111B"/>
<defs><linearGradient id="glow" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1E4D52" stop-opacity=".54"/><stop offset="1" stop-color="#0A111B" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="600" height="1150" rx="0" fill="url(#glow)"/>
<text x="40" y="48" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" letter-spacing="2">VERIFICATION LADDER</text><text x="40" y="105" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" text-anchor="start">Four complementary checks</text><path d="M40 126 L560 126" stroke="#244657" stroke-width="2" stroke-linecap="round"/><rect x="36" y="159" width="528" height="212" rx="20" fill="#142432" stroke="#244657"/><rect x="55" y="179" width="60" height="40" rx="12" fill="#244251"/><text x="85" y="206" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">01</text><text x="137" y="206" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start" letter-spacing="1">UNIT</text><text x="55" y="274" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Logic and edge cases</text><text x="55" y="325" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Fast, offline</text><rect x="36" y="387" width="528" height="212" rx="20" fill="#142432" stroke="#244657"/><rect x="55" y="407" width="60" height="40" rx="12" fill="#244251"/><text x="85" y="434" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">02</text><text x="137" y="434" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start" letter-spacing="1">CONTRACT</text><text x="55" y="502" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" text-anchor="start">HTTP expectations</text><text x="55" y="553" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Requests + responses</text><rect x="36" y="615" width="528" height="212" rx="20" fill="#142432" stroke="#244657"/><rect x="55" y="635" width="60" height="40" rx="12" fill="#244251"/><text x="85" y="662" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">03</text><text x="137" y="662" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start" letter-spacing="1">UI</text><text x="55" y="730" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Task completion</text><text x="55" y="781" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">States and access</text><rect x="36" y="843" width="528" height="212" rx="20" fill="#142432" stroke="#244657"/><rect x="55" y="863" width="60" height="40" rx="12" fill="#244251"/><text x="85" y="890" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">04</text><text x="137" y="890" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE</text><text x="55" y="958" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Operating signals</text><text x="55" y="1009" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Uptime is not proof</text><text x="36" y="1102" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">No single green check guarantees a</text><text x="36" y="1129" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">healthy product.</text>
</svg>