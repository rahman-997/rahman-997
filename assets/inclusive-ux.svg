<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" role="img" aria-labelledby="ux-title ux-desc">
  <title id="ux-title">Four pillars of inclusive experience design</title>
  <desc id="ux-desc">A two-by-two grid of quality checks: responsive layouts, keyboard access, readable content and bidirectional text for multilingual interfaces.</desc>
  <defs>
    <linearGradient id="ux-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152939"/><stop offset="1" stop-color="#0A1522"/></linearGradient>
    <linearGradient id="ux-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#AFF6DC"/><stop offset="1" stop-color="#5CCEC2"/></linearGradient>
  </defs>
  <rect width="560" height="268" rx="16" fill="url(#ux-bg)"/>
  <rect x="1" y="1" width="558" height="266" rx="15" fill="none" stroke="#42616A"/>
  <circle cx="535" cy="-2" r="93" fill="#237E75" opacity=".11"/>
  <text x="22" y="29" font-family="Arial,sans-serif" font-weight="700" font-size="12" letter-spacing="1.6" fill="#B3F3DD">USER EXPERIENCE / INCLUSION</text>
  <text x="22" y="55" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#F1FAF8">Make the interface work for everyone.</text>
  <g font-family="Arial,sans-serif">
    <g fill="#1C3541" stroke="#4A6C76">
      <rect x="20" y="78" width="255" height="70" rx="11"/><rect x="285" y="78" width="255" height="70" rx="11"/>
      <rect x="20" y="157" width="255" height="70" rx="11"/><rect x="285" y="157" width="255" height="70" rx="11"/>
    </g>
    <g fill="none" stroke="url(#ux-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="34" y="94" width="32" height="24" rx="3"/><path d="M45 123h10m-5-5v5"/>
      <rect x="70" y="98" width="12" height="20" rx="2"/><path d="M75 115h2"/>
      <rect x="299" y="95" width="35" height="24" rx="4"/><path d="M307 103h19m-19 7h7m6 0h6"/>
      <rect x="34" y="172" width="43" height="27" rx="4"/><path d="M41 180h28m-28 6h22m-22 6h17"/>
      <path d="M300 185h37m-37-4-5 4 5 4m37-8 5 4-5 4"/><path d="M313 174v22m9-22v22"/>
    </g>
    <g font-size="15" font-weight="700" fill="#F2FBFA">
      <text x="94" y="104">Responsive</text><text x="348" y="104">Keyboard first</text>
      <text x="91" y="184">Readable</text><text x="348" y="184">RTL + LTR</text>
    </g>
    <g font-size="11.5" fill="#BFD9DA">
      <text x="94" y="124">Every viewport</text><text x="348" y="124">Focus and control</text>
      <text x="91" y="204">Clear content states</text><text x="348" y="204">Mixed-script clarity</text>
    </g>
  </g>
  <text x="280" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#C3EEE4">Design → Verify with people, devices and assistive tools</text>
</svg>
