<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Mobile decision pathway with three steps for selecting storage and testing important data invariants.">
<rect x="0" y="0" width="600" height="900" rx="0" fill="#0A111B"/>
<defs><linearGradient id="glow" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1E4D52" stop-opacity=".54"/><stop offset="1" stop-color="#0A111B" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="600" height="900" rx="0" fill="url(#glow)"/>
<text x="40" y="48" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" letter-spacing="2">ARCHITECTURE DECISION PATHS</text><text x="40" y="105" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" text-anchor="start">Choose for the constraint</text><path d="M40 126 L560 126" stroke="#244657" stroke-width="2" stroke-linecap="round"/><rect x="36" y="165" width="528" height="186" rx="22" fill="#142432" stroke="#244657"/><rect x="55" y="183" width="72" height="37" rx="12" fill="#203B49"/><text x="91" y="209" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">01</text><text x="150" y="209" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" letter-spacing="1">IDENTIFY</text><text x="55" y="266" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" text-anchor="start">Data ownership</text><text x="55" y="311" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Local / shared / durable</text><path d="M300 353 L300 373" stroke="#79E6C6" stroke-width="4" stroke-linecap="round"/><rect x="36" y="373" width="528" height="186" rx="22" fill="#142432" stroke="#244657"/><rect x="55" y="391" width="72" height="37" rx="12" fill="#203B49"/><text x="91" y="417" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">02</text><text x="150" y="417" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" letter-spacing="1">CHOOSE</text><text x="55" y="474" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" text-anchor="start">Persistence boundary</text><text x="55" y="519" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Browser / database / queue</text><path d="M300 561 L300 581" stroke="#79E6C6" stroke-width="4" stroke-linecap="round"/><rect x="36" y="581" width="528" height="186" rx="22" fill="#142432" stroke="#244657"/><rect x="55" y="599" width="72" height="37" rx="12" fill="#203B49"/><text x="91" y="625" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">03</text><text x="150" y="625" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" letter-spacing="1">PROVE</text><text x="55" y="682" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" text-anchor="start">Critical invariant</text><text x="55" y="727" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Tests + failure behavior</text><text x="36" y="835" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Reference code: Mizan / Eventify /</text><text x="36" y="868" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">BookHaven / Venues API</text>
</svg>