<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img" aria-label="Four layers of verification: unit tests, HTTP contracts, user interface flows, and live deployment signals; no layer proves everything.">
<rect x="0" y="0" width="1200" height="485" rx="0" fill="#0A111B"/>
<defs><linearGradient id="glow" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1E4D52" stop-opacity=".54"/><stop offset="1" stop-color="#0A111B" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="485" rx="0" fill="url(#glow)"/>
<text x="40" y="48" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" letter-spacing="2">VERIFICATION LADDER</text><text x="40" y="105" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" text-anchor="start">Four complementary checks</text><path d="M40 126 L1160 126" stroke="#244657" stroke-width="2" stroke-linecap="round"/><rect x="36" y="167" width="280" height="247" rx="22" fill="#142432" stroke="#244657"/><rect x="57" y="186" width="53" height="40" rx="12" fill="#244251"/><text x="83" y="215" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">01</text><text x="57" y="264" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="start" letter-spacing="1.5">UNIT</text><text x="57" y="314" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Logic and edge cases</text><text x="57" y="359" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Fast, offline</text><rect x="330" y="167" width="280" height="247" rx="22" fill="#142432" stroke="#244657"/><rect x="351" y="186" width="53" height="40" rx="12" fill="#244251"/><text x="377" y="215" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">02</text><text x="351" y="264" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="start" letter-spacing="1.5">CONTRACT</text><text x="351" y="314" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start">HTTP expectations</text><text x="351" y="359" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Requests + responses</text><rect x="624" y="167" width="280" height="247" rx="22" fill="#142432" stroke="#244657"/><rect x="645" y="186" width="53" height="40" rx="12" fill="#244251"/><text x="671" y="215" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">03</text><text x="645" y="264" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="start" letter-spacing="1.5">UI</text><text x="645" y="314" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Task completion</text><text x="645" y="359" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">States and access</text><rect x="918" y="167" width="280" height="247" rx="22" fill="#142432" stroke="#244657"/><rect x="939" y="186" width="53" height="40" rx="12" fill="#244251"/><text x="965" y="215" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">04</text><text x="939" y="264" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="start" letter-spacing="1.5">LIVE</text><text x="939" y="314" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Operating signals</text><text x="939" y="359" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Uptime is not proof</text><text x="36" y="463" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Evidence must match the question. No single green check guarantees a healthy product.</text>
</svg>