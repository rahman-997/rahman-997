<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" role="img" aria-labelledby="dc-title dc-desc">
  <title id="dc-title">Design systems and thoughtful interface states</title>
  <desc id="dc-desc">A compact application mockup demonstrates navigation, content hierarchy, accessible controls and design tokens for reusable interface patterns.</desc>
  <defs>
    <linearGradient id="dc-background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183240"/><stop offset="1" stop-color="#0B1724"/></linearGradient>
    <linearGradient id="dc-highlight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B6F8DC"/><stop offset="1" stop-color="#55CEC5"/></linearGradient>
  </defs>
  <rect width="560" height="268" rx="17" fill="url(#dc-background)"/>
  <rect x="1" y="1" width="558" height="266" rx="16" fill="none" stroke="#43626A"/>
  <circle cx="548" cy="-12" r="116" fill="#33A995" opacity=".1"/>
  <g font-family="Arial,sans-serif">
