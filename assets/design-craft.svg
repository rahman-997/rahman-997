    <text x="88" y="100" font-size="9" fill="#C4E4E3">Workspace / Overview</text>
    <rect x="30" y="118" width="72" height="114" rx="7" fill="#193541"/>
    <rect x="37" y="127" width="58" height="15" rx="4" fill="#2E6661"/>
    <g fill="#C8DCDF" font-size="8"><text x="44" y="137">Overview</text><text x="44" y="158">Projects</text><text x="44" y="178">Activity</text><text x="44" y="198">Settings</text></g>
    <text x="115" y="134" fill="#EBF6F4" font-size="12" font-weight="700">Recent activity</text>
    <text x="115" y="149" fill="#B0C9CE" font-size="9">Clear hierarchy, useful state</text>
