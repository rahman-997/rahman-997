<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 245" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Architecture, from interaction to observability</title>
  <desc id="arch-desc">Four stages flow left to right: interface, API, data and jobs, and health signals. Connected boundaries emphasize predictable delivery.</desc>
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152736"/><stop offset="1" stop-color="#0C1724"/></linearGradient>
    <linearGradient id="arch-mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#96EED3"/><stop offset="1" stop-color="#4BC8B5"/></linearGradient>
  </defs>
  <rect width="560" height="245" rx="16" fill="url(#arch-bg)"/>
  <rect x="1" y="1" width="558" height="243" rx="15" fill="none" stroke="#3B5865"/>
  <circle cx="538" cy="10" r="86" fill="#2D786E" opacity=".12"/>
  <text x="22" y="30" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9EEED9">SYSTEMS / THINKING</text>
  <text x="22" y="54" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#EDF8F7">Follow the request. Own the boundaries.</text>
  <g font-family="Arial,sans-serif">
    <rect x="20" y="85" width="115" height="100" rx="11" fill="#1D3440" stroke="#4C7080"/>
    <rect x="155" y="85" width="115" height="100" rx="11" fill="#1D3440" stroke="#4C7080"/>
    <rect x="290" y="85" width="115" height="100" rx="11" fill="#1D3440" stroke="#4C7080"/>
    <rect x="425" y="85" width="115" height="100" rx="11" fill="#1D3440" stroke="#4C7080"/>
    <g fill="url(#arch-mint)"><circle cx="42" cy="106" r="6"/><circle cx="177" cy="106" r="6"/><circle cx="312" cy="106" r="6"/><circle cx="447" cy="106" r="6"/></g>
    <g font-size="15" font-weight="700" fill="#EFF7FA">
      <text x="31" y="138">Interface</text><text x="166" y="138">API</text><text x="301" y="138">Data</text><text x="436" y="138">Signals</text>
    </g>
    <g font-size="10.5" fill="#B2CAD1">
      <text x="31" y="158">Usable flows</text><text x="166" y="158">Validation</text><text x="301" y="158">Stores &amp; jobs</text><text x="436" y="158">Health &amp; tests</text>
    </g>
  </g>
  <g fill="none" stroke="#83D8C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M137 133h15l-5-5m5 5-5 5"/><path d="M272 133h15l-5-5m5 5-5 5"/><path d="M407 133h15l-5-5m5 5-5 5"/></g>
  <rect x="20" y="204" width="520" height="26" rx="8" fill="#163B38" stroke="#37756F"/>
  <text x="280" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" letter-spacing=".5" fill="#B9F4E5">Clear contracts · observable failures · verified behavior</text>
</svg>
