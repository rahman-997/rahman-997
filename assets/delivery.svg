<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 225" role="img" aria-labelledby="delivery-title delivery-desc">
  <title id="delivery-title">From brief to dependable release</title>
  <desc id="delivery-desc">Four-step path: frame, build, verify and release, each accompanied by a simple quality principle.</desc>
  <defs><linearGradient id="del-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13222F"/><stop offset="1" stop-color="#101A2A"/></linearGradient><linearGradient id="del-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#99EED9"/><stop offset="1" stop-color="#55C7BC"/></linearGradient></defs>
  <rect width="560" height="225" rx="16" fill="url(#del-bg)"/>
  <rect x="1" y="1" width="558" height="223" rx="15" stroke="#3B5865" fill="none"/>
  <text x="22" y="31" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#9AECD5" letter-spacing="2">DELIVERY / LOOP</text>
  <text x="22" y="56" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#F3F9FA">Build what matters. Verify what ships.</text>
  <path d="M55 98H504" fill="none" stroke="#478377" stroke-width="3" stroke-dasharray="3 5"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g>
      <circle cx="67" cy="98" r="21" fill="#215347" stroke="#80DFCA" stroke-width="2"/><text x="67" y="104" font-size="15" font-weight="700" fill="#E4FAF2">01</text>
      <circle cx="209" cy="98" r="21" fill="#215347" stroke="#80DFCA" stroke-width="2"/><text x="209" y="104" font-size="15" font-weight="700" fill="#E4FAF2">02</text>
      <circle cx="351" cy="98" r="21" fill="#215347" stroke="#80DFCA" stroke-width="2"/><text x="351" y="104" font-size="15" font-weight="700" fill="#E4FAF2">03</text>
      <circle cx="493" cy="98" r="21" fill="#215347" stroke="#80DFCA" stroke-width="2"/><text x="493" y="104" font-size="15" font-weight="700" fill="#E4FAF2">04</text>
    </g>
    <g fill="#F0F8FB" font-size="16" font-weight="700"><text x="67" y="147">Frame</text><text x="209" y="147">Build</text><text x="351" y="147">Verify</text><text x="493" y="147">Release</text></g>
    <g fill="#A8C8CF" font-size="10.5"><text x="67" y="168">Right problem</text><text x="209" y="168">Clear boundaries</text><text x="351" y="168">Test the risks</text><text x="493" y="168">Observe &amp; learn</text></g>
  </g>
  <path d="M25 195h510" stroke="#365765"/><rect x="24" y="202" width="512" height="5" rx="2.5" fill="url(#del-accent)"/>
</svg>
