<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 256" role="img" aria-labelledby="quality-title quality-desc">
  <title id="quality-title">Four quality gates from change to release</title>
  <desc id="quality-desc">A horizontal flow shows reviewing a change, running automated tests, assessing security boundaries and verifying a release.</desc>
  <defs>
    <linearGradient id="q-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182E3C"/><stop offset="1" stop-color="#0B1624"/></linearGradient>
    <linearGradient id="q-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B4F7DA"/><stop offset="1" stop-color="#55D4C6"/></linearGradient>
  </defs>
  <rect width="560" height="256" rx="16" fill="url(#q-bg)"/>
  <rect x="1" y="1" width="558" height="254" rx="15" fill="none" stroke="#42616A"/>
  <circle cx="548" cy="-4" r="102" fill="#29776F" opacity=".11"/>
  <text x="22" y="29" font-family="Arial,sans-serif" font-weight="700" font-size="12" letter-spacing="1.7" fill="#B0EFD9">QUALITY / RELIABILITY</text>
  <text x="22" y="55" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#F0FAF8">Ship with evidence, not assumptions.</text>
  <g font-family="Arial,sans-serif">
    <rect x="20" y="83" width="122" height="113" rx="11" fill="#1B3340" stroke="#4F707B"/>
    <rect x="153" y="83" width="122" height="113" rx="11" fill="#1B3340" stroke="#4F707B"/>
    <rect x="286" y="83" width="122" height="113" rx="11" fill="#1B3340" stroke="#4F707B"/>
    <rect x="419" y="83" width="122" height="113" rx="11" fill="#1B3340" stroke="#4F707B"/>
    <g fill="url(#q-accent)" font-size="12" font-weight="700">
      <text x="32" y="105">01  REVIEW</text>
      <text x="165" y="105">02  TEST</text>
      <text x="298" y="105">03  SECURE</text>
      <text x="431" y="105">04  VERIFY</text>
    </g>
    <g fill="#F1F8F8" font-size="16" font-weight="700">
      <text x="32" y="137">Change</text>
      <text x="165" y="137">Behavior</text>
      <text x="298" y="137">Boundaries</text>
      <text x="431" y="137">Release</text>
    </g>
    <g fill="#C2D6D8" font-size="11.5">
      <text x="32" y="158">Scope and intent</text>
      <text x="165" y="158">Edge cases</text>
      <text x="298" y="158">Input and access</text>
      <text x="431" y="158">Health signals</text>
      <text x="32" y="176">Reviewable diff</text>
      <text x="165" y="176">Repeatable checks</text>
      <text x="298" y="176">Secrets protected</text>
      <text x="431" y="176">Known limits</text>
    </g>
  </g>
  <g stroke="#97EBD5" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 139h7m-5-4 5 4-5 4"/><path d="M277 139h7m-5-4 5 4-5 4"/><path d="M410 139h7m-5-4 5 4-5 4"/>
  </g>
  <rect x="20" y="211" width="521" height="27" rx="8" fill="#173934" stroke="#34786F"/>
  <text x="280" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#D2FAEC">Decisions visible  ·  Failures testable  ·  Release observable</text>
</svg>
