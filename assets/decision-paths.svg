<text x="40" y="48" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" letter-spacing="2">ARCHITECTURE DECISION PATHS</text><text x="40" y="105" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="bold" text-anchor="start">Choose for the constraint</text><path d="M40 126 L1160 126" stroke="#244657" stroke-width="2" stroke-linecap="round"/><rect x="40" y="166" width="356" height="234" rx="24" fill="#142432" stroke="#244657"/><rect x="62" y="192" width="76" height="38" rx="16" fill="#203B49"/><text x="100" y="218" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">01</text><text x="62" y="276" fill="#79E6C6" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" letter-spacing="1.5">IDENTIFY</text><text x="62" y="320" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Data ownership</text><text x="62" y="363" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Local / shared / durable</text><path d="M396 282 L428 282" stroke="#79E6C6" stroke-width="4" stroke-linecap="round"/><rect x="428" y="166" width="356" height="234" rx="24" fill="#142432" stroke="#244657"/><rect x="450" y="192" width="76" height="38" rx="16" fill="#203B49"/><text x="488" y="218" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">02</text><text x="450" y="276" fill="#8FBFFA" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" letter-spacing="1.5">CHOOSE</text><text x="450" y="320" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Persistence boundary</text><text x="450" y="363" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Browser / database / queue</text><path d="M784 282 L816 282" stroke="#79E6C6" stroke-width="4" stroke-linecap="round"/><rect x="816" y="166" width="356" height="234" rx="24" fill="#142432" stroke="#244657"/><rect x="838" y="192" width="76" height="38" rx="16" fill="#203B49"/><text x="876" y="218" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">03</text><text x="838" y="276" fill="#E6BE79" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="start" letter-spacing="1.5">PROVE</text><text x="838" y="320" fill="#F2FAF8" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Critical invariant</text><text x="838" y="363" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Tests + failure behavior</text><text x="40" y="445" fill="#A9C3C6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Source examples: Mizan Finance  /  Eventify  /  BookHaven  /  Venues API</text>
